<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADEL V10.4 CAM+QR WORKING</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0;padding:10px}
.top{border:2px solid #00ff88;border-radius:18px;padding:15px;text-align:center;margin-bottom:12px;background:#111}
.top h1{color:#00ff88;margin:0;font-size:20px}
.top h2{color:#ffcc00;margin:5px 0;font-size:18px}
.row{display:flex;gap:0;margin:8px 0}
.row input{flex:1;padding:12px;border-radius:10px;border:1.5px solid #ffcc00;background:#222;color:#fff;margin:0}
.row input:first-child{border-top-right-radius:0;border-bottom-right-radius:0}
.row input:last-child{border-top-left-radius:0;border-bottom-left-radius:0;border-left:0}
.btn-save{background:#ffcc00;color:#000;padding:12px;border:0;border-radius:30px;width:100%;font-weight:900;font-size:16px;margin:8px 0}
.qr-box{background:#fff;padding:8px;border-radius:12px;margin:10px auto;width:160px;text-align:center}
.qr-box img{width:150px;height:150px}
.cats{border:1.5px solid #ffcc00;border-radius:15px;padding:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;background:#111}
.cat{padding:10px;border-radius:10px;border:1.5px solid #ffcc00;background:#222;color:#ffcc00;text-align:center;font-weight:700;font-size:13px}
.cat.active{background:#ffcc00;color:#000}
.list{border:1.5px solid #ffcc00;border-radius:15px;padding:12px;background:#111}
.list h3{color:#ffcc00;text-align:center;margin-top:0}
.item{display:flex;align-items:center;justify-content:space-between;padding:12px;margin:8px 0;border-radius:0 12px 12px 0;background:#0a1f12;border-right:4px solid #00ff88}
.item.bad{background:#2a1212;border-right-color:#ff4444}
.left{display:flex;align-items:center;gap:8px}
.cam{background:#222;border:1.5px solid #ffcc00;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:18px}
.checkbox{width:26px;height:26px}
.thumb{width:45px;height:45px;border-radius:6px;border:2px solid #00ff88;object-fit:cover}
.inspector-box{margin-top:12px;border:1.5px solid #d4af37;border-radius:12px;padding:12px;background:#151821}
.inspector-box input,.inspector-box textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #444;background:#222;color:#fff;margin:6px 0;box-sizing:border-box}
canvas.sig{background:#fff;border-radius:10px;width:100%;height:150px;touch-action:none}
.btn{width:100%;padding:14px;border-radius:12px;border:0;margin-top:8px;font-weight:700;cursor:pointer}
.green{background:#16a34a;color:#fff}
.outline{background:transparent;border:1px solid #d4af37;color:#d4af37}
</style>
</head>
<body>
<div class="top">
<h1>ADEL V10.4 CAM+QR WORKING</h1>
<h2>SBG | Rakaez A-4</h2>
<div class="row"><input id="project" value="Rakaez A-4" oninput="genQR()"><input id="company" placeholder="Company Name" oninput="genQR()"></div>
<div class="row"><input id="zone" placeholder="Zone" oninput="genQR()"><input id="area" placeholder="Area m2" oninput="genQR()"></div>
<button class="btn-save" onclick="localStorage.setItem('company',document.getElementById('company').value);alert('Saved')">SAVE Company</button>
<div id="progress" style="color:#ffcc00;font-weight:700;margin-top:5px">ELEC: 0/20 - 0%</div>
<div class="qr-box"><img id="qrImg" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=ADEL-SBG" alt="QR"><div style="color:#000;font-size:11px;font-weight:900;margin-top:4px" id="qrtext">QR Report</div></div>
</div>
<div class="cats">
<div class="cat" onclick="setCat('scaffold',event)">Scaffold 30</div>
<div class="cat" onclick="setCat('crane',event)">Crane 25</div>
<div class="cat" onclick="setCat('forklift',event)">Forklift 29</div>
<div class="cat" onclick="setCat('ppe',event)">PPE 16</div>
<div class="cat" onclick="setCat('ptw',event)">PTW 21</div>
<div class="cat active" onclick="setCat('elec',event)">Electrical 20</div>
</div>
<div class="list">
<h3 id="catTitle">Electrical Inspection 20 Items</h3>
<div id="items"></div>
<div class="inspector-box">
<input id="inspector" value="Adel Mohamed"><input id="engName" placeholder="Engineer Name"><textarea id="notes" placeholder="Notes"></textarea>
<p style="text-align:center;color:#ffcc00">Signature:</p>
<canvas id="sig" class="sig"></canvas>
<button class="btn outline" onclick="clearSig()">Clear Signature</button>
<button class="btn green" onclick="genPDF()">Generate PDF V10.4 with PHOTOS+QR</button>
</div>
</div>
<input type="file" id="camInput" accept="image/*" capture="environment" style="display:none">
<script>
const data={scaffold:Array.from({length:30},(_,i)=>`Scaffold Item ${i+1}`),crane:Array.from({length:25},(_,i)=>`Crane Item ${i+1}`),forklift:Array.from({length:29},(_,i)=>`Forklift Item ${i+1}`),ppe:Array.from({length:16},(_,i)=>`PPE Item ${i+1}`),ptw:Array.from({length:21},(_,i)=>`PTW Item ${i+1}`),elec:["Panel Locked","ELCB Working","Earthing OK","No Exposed Wires","Closed Boxes","High Voltage Signs","CO2 Extinguisher","Cable Joints OK","Insulation OK","Overload Protection","Lockout Tagout","Lighting OK","DB Cover Locked","Socket OK","Wiring Dressed","No Overload","MCB Rating OK","Emergency Stop","Isolation OK","Inspection Tag"]};
let currentCat='elec',states={},photos={},tempCat,tempIdx;
Object.keys(data).forEach(k=>{states[k]=Array(data[k].length).fill(false);photos[k]={}});
function setCat(cat,e){currentCat=cat;document.querySelectorAll('.cat').forEach(c=>c.classList.remove('active'));e.target.classList.add('active');document.getElementById('catTitle').textContent=cat.toUpperCase()+' '+data[cat].length+' Items';render();}
function render(){let cont=document.getElementById('items');cont.innerHTML='';data[currentCat].forEach((t,i)=>{let div=document.createElement('div');div.className='item '+(states[currentCat][i]?'':'bad');let has=photos[currentCat][i]?`<img src="${photos[currentCat][i]}" class="thumb">`:'';div.innerHTML=`<div class="left"><span class="cam" onclick="takePhoto('${currentCat}',${i})">📸</span><input type="checkbox" class="checkbox" ${states[currentCat][i]?'checked':''} onchange="toggle('${currentCat}',${i})">${has}</div><div style="font-size:13px">${t}</div>`;cont.appendChild(div);});let total=data[currentCat].length,ok=states[currentCat].filter(x=>x).length;document.getElementById('progress').textContent=currentCat.toUpperCase()+': '+ok+'/'+total+' - '+Math.round(ok*100/total)+'%';}
function toggle(c,i){states[c][i]=!states[c][i];render();}
function takePhoto(c,i){tempCat=c;tempIdx=i;document.getElementById('camInput').click();}
document.getElementById('camInput').addEventListener('change',function(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{photos[tempCat][tempIdx]=ev.target.result;render();};r.readAsDataURL(f);e.target.value='';});
function genQR(){let p=document.getElementById('project').value,co=document.getElementById('company').value||'Company',z=document.getElementById('zone').value||'',a=document.getElementById('area').value||'';let txt=`Project:${p} | Company:${co} | Zone:${z} | Area:${a}m2 | Date:${new Date().toLocaleString()} | Inspector:Adel Mohamed | SBG Rakaez`;document.getElementById('qrtext').textContent=co;document.getElementById('qrImg').src='https://api.qrserver.com/v1/create-qr-code/?size=150x150&data='+encodeURIComponent(txt);}
let canvas=document.getElementById('sig'),ctx=canvas.getContext('2d'),draw=false;setTimeout(()=>{let r=window.devicePixelRatio||1;canvas.width=canvas.offsetWidth*r;canvas.height=150*r;ctx.setTransform(r,0,0,r,0,0);ctx.lineWidth=2;ctx.lineCap='round';ctx.strokeStyle='#000';genQR();},400);canvas.addEventListener('pointerdown',e=>{draw=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY);});canvas.addEventListener('pointermove',e=>{if(!draw)return;ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke();});window.addEventListener('pointerup',()=>draw=false);function clearSig(){ctx.clearRect(0,0,canvas.width,canvas.height)}
function genPDF(){const {jsPDF}=window.jspdf;let doc=new jsPDF();let insp=document.getElementById('inspector').value,proj=document.getElementById('project').value,comp=document.getElementById('company').value||'N/A',zone=document.getElementById('zone').value||'N/A',area=document.getElementById('area').value||'N/A',eng=document.getElementById('engName').value||'N/A',notes=document.getElementById('notes').value||'N/A';let now=new Date();let ds=String(now.getDate()).padStart(2,'0')+'/'+String(now.getMonth()+1).padStart(2,'0')+'/'+now.getFullYear()+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');doc.setFont('helvetica','bold');doc.setFontSize(14);doc.text('HSE Inspection Report - SBG Rakaez A-4',10,15);doc.setFont('helvetica','normal');doc.setFontSize(11);doc.text('Project: '+proj,10,25);doc.text('Company: '+comp,10,32);doc.text('Zone: '+zone+' | Area: '+area+' m2',10,39);doc.text('Inspector: '+insp,10,46);doc.text('Date: '+ds,10,53);doc.text('Engineer: '+eng,10,60);try{let qi=document.getElementById('qrImg').src;doc.addImage(qi,'PNG',160,25,35,35);}catch(e){}let y=75;Object.keys(data).forEach(cat=>{doc.setFont('helvetica','bold');doc.text(cat.toUpperCase()+' - '+data[cat].length+' Items:',10,y);y+=7;doc.setFont('helvetica','normal');data[cat].forEach((t,i)=>{doc.text((i+1)+'. '+t+' : '+(states[cat][i]?'OK':'NOT OK'),12,y);if(photos[cat][i]){try{doc.addImage(photos[cat][i],'JPEG',120,y-4,18,12);}catch(e){}}y+=7;if(y>275){doc.addPage();y=15}});y+=4;if(y>275){doc.addPage();y=15}});doc.text('Notes: '+notes,10,y);y+=10;doc.text('Inspector Signature:',10,y);try{if(canvas.toDataURL()!==document.createElement('canvas').toDataURL()){let img=canvas.toDataURL('image/png');doc.addImage(img,'PNG',10,y+5,60,20);}}catch(e){}doc.save('HSE_'+comp+'_'+now.toISOString().slice(0,10)+'.pdf');}render();
</script>
</body>
</html>
