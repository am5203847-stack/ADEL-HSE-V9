<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADEL V10.2 FULL PDF FIXED</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0;padding:10px}
.top{border:2px solid #00ff88;border-radius:18px;padding:15px;text-align:center;margin-bottom:12px;background:#111}
.top h1{color:#00ff88;margin:0;font-size:22px}
.top h2{color:#ffcc00;margin:5px 0;font-size:18px}
.row{display:flex;gap:0;margin:8px 0}
.row input{flex:1;padding:12px;border-radius:10px;border:1.5px solid #ffcc00;background:#222;color:#fff;margin:0}
.row input:first-child{border-top-right-radius:0;border-bottom-right-radius:0}
.row input:last-child{border-top-left-radius:0;border-bottom-left-radius:0;border-left:0}
.btn-save{background:#ffcc00;color:#000;padding:12px;border:0;border-radius:30px;width:100%;font-weight:900;font-size:16px;margin:8px 0;cursor:pointer}
.cats{border:1.5px solid #ffcc00;border-radius:15px;padding:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;background:#111}
.cat{padding:10px;border-radius:10px;border:1.5px solid #ffcc00;background:#222;color:#ffcc00;text-align:center;font-weight:700;cursor:pointer;font-size:13px}
.cat.active{background:#ffcc00;color:#000}
.list{border:1.5px solid #ffcc00;border-radius:15px;padding:12px;background:#111}
.list h3{color:#ffcc00;text-align:center;margin-top:0}
.item{display:flex;align-items:center;justify-content:space-between;padding:12px;margin:8px 0;border-radius:0 12px 12px 0;background:#0a1f12;border-right:4px solid #00ff88}
.item.bad{background:#2a1212;border-right-color:#ff4444}
.left{display:flex;align-items:center;gap:8px}
.cam{background:#222;border:1.5px solid #ffcc00;border-radius:8px;padding:6px;cursor:pointer;font-size:18px}
.checkbox{width:26px;height:26px}
.inspector-box{margin-top:12px;border:1.5px solid #d4af37;border-radius:12px;padding:12px;background:#151821}
.inspector-box input, .inspector-box textarea, .inspector-box select{width:100%;padding:10px;border-radius:8px;border:1px solid #444;background:#222;color:#fff;margin:6px 0;box-sizing:border-box}
canvas{background:#fff;border-radius:10px;width:100%;height:150px;touch-action:none}
.btn{width:100%;padding:14px;border-radius:12px;border:0;margin-top:8px;font-weight:700;cursor:pointer}
.green{background:#16a34a;color:#fff}
.outline{background:transparent;border:1px solid #d4af37;color:#d4af37}
</style>
</head>
<body>
<div class="top">
<h1>ADEL V10.2 PDF FIXED</h1>
<h2>SBG | Rakaez A-4</h2>
<div class="row"><input id="project" placeholder="Project" value="Rakaez A-4"><input id="company" placeholder="Company Name"></div>
<div class="row"><input id="zone" placeholder="Zone"><input id="area" placeholder="Area m2"></div>
<button class="btn-save" onclick="saveCompany()">SAVE Company</button>
<div id="progress" style="color:#ffcc00;font-weight:700;margin-top:5px">ELEC: 0/20 - 0%</div>
</div>

<div class="cats">
<div class="cat" onclick="setCat('scaffold')">Scaffold 30</div>
<div class="cat" onclick="setCat('crane')">Crane 25</div>
<div class="cat" onclick="setCat('forklift')">Forklift 29</div>
<div class="cat" onclick="setCat('ppe')">PPE 16</div>
<div class="cat" onclick="setCat('ptw')">PTW 21</div>
<div class="cat active" onclick="setCat('elec')">Electrical 20</div>
</div>

<div class="list">
<h3 id="catTitle">Electrical Inspection 20 Items</h3>
<div id="items"></div>

<div class="inspector-box">
<input id="inspector" value="Adel Mohamed">
<input id="engName" placeholder="Engineer Name">
<textarea id="notes" placeholder="Notes / Observations"></textarea>
<p style="text-align:center;margin:5px">Signature:</p>
<canvas id="sig"></canvas>
<button class="btn outline" onclick="clearSig()">Clear Signature</button>
<button class="btn green" onclick="genPDF()">Generate PDF V10.2 FIXED</button>
</div>
</div>

<script>
const data={
scaffold:Array.from({length:30},(_,i)=>`Scaffold Item ${i+1}`),
crane:Array.from({length:25},(_,i)=>`Crane Item ${i+1}`),
forklift:Array.from({length:29},(_,i)=>`Forklift Item ${i+1}`),
ppe:Array.from({length:16},(_,i)=>`PPE Item ${i+1}`),
ptw:Array.from({length:21},(_,i)=>`PTW Item ${i+1}`),
elec:["Panel Locked","ELCB/GFCI Working","Earthing OK","No Exposed Wires","Closed Boxes","High Voltage Signs","CO2 Extinguisher","Cable Joints OK","Insulation OK","Overload Protection","Lockout Tagout","Lighting OK","DB Cover Locked","Socket OK","Wiring Dressed","No Overload","MCB Rating OK","Emergency Stop","Isolation OK","Inspection Tag"]
};
let currentCat='elec';
let states={};
Object.keys(data).forEach(k=>states[k]=Array(data[k].length).fill(false));

function setCat(cat){
currentCat=cat;
document.querySelectorAll('.cat').forEach(c=>c.classList.remove('active'));
event.target.classList.add('active');
document.getElementById('catTitle').textContent=cat.toUpperCase()+' Inspection '+data[cat].length+' Items';
render();
}

function render(){
let cont=document.getElementById('items');cont.innerHTML='';
data[currentCat].forEach((t,i)=>{
let div=document.createElement('div');
div.className='item '+(states[currentCat][i]?'':'bad');
div.innerHTML=`<div class="left"><span class="cam" onclick="takePhoto('${currentCat}',${i})">&#128247;</span><input type="checkbox" class="checkbox" ${states[currentCat][i]?'checked':''} onchange="toggle('${currentCat}',${i})"></div><div>${t} -${i+1}</div>`;
cont.appendChild(div);
});
updateProgress();
}

function toggle(cat,i){states[cat][i]=!states[cat][i];render();}
function updateProgress(){
let total=data[currentCat].length;let ok=states[currentCat].filter(x=>x).length;
let per=Math.round(ok*100/total);
document.getElementById('progress').textContent=currentCat.toUpperCase()+': '+ok+'/'+total+' - '+per+'%';
}
function saveCompany(){let c=document.getElementById('company').value;if(c){localStorage.setItem('company',c);alert('Saved: '+c)}}
function takePhoto(cat,i){alert('Photo for '+cat+' item '+(i+1)+' - camera will be added if needed');}

let canvas=document.getElementById('sig'),ctx=canvas.getContext('2d'),draw=false;
function resize(){let r=window.devicePixelRatio||1;canvas.width=canvas.offsetWidth*r;canvas.height=150*r;ctx.setTransform(r,0,0,r,0,0);ctx.lineWidth=2;ctx.lineCap='round';ctx.strokeStyle='#000';}
setTimeout(resize,200);
canvas.addEventListener('pointerdown',e=>{draw=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY);e.preventDefault()});
canvas.addEventListener('pointermove',e=>{if(!draw)return;ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke();e.preventDefault()});
window.addEventListener('pointerup',()=>draw=false);
function clearSig(){ctx.clearRect(0,0,canvas.width,canvas.height)}

function genPDF(){
const {jsPDF}=window.jspdf;let doc=new jsPDF();
let inspector=document.getElementById('inspector').value||'Adel Mohamed';
let project=document.getElementById('project').value||'Rakaez A-4';
let company=document.getElementById('company').value||localStorage.getItem('company')||'N/A';
let zone=document.getElementById('zone').value||'N/A';
let area=document.getElementById('area').value||'N/A';
let eng=document.getElementById('engName').value||'N/A';
let notes=document.getElementById('notes').value||'N/A';
let now=new Date();
let dateStr=String(now.getDate()).padStart(2,'0')+'/'+String(now.getMonth()+1).padStart(2,'0')+'/'+now.getFullYear()+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');

doc.setFont('helvetica','bold');doc.setFontSize(14);
doc.text('HSE Inspection Report - SBG Rakaez A-4',10,15);
doc.setFont('helvetica','normal');doc.setFontSize(11);
doc.text('Project: '+project,10,25);
doc.text('Company: '+company,10,32);
doc.text('Zone: '+zone+' | Area: '+area+' m2',10,39);
doc.text('Inspector: '+inspector,10,46);
doc.text('Date: '+dateStr,10,53);
doc.text('Engineer: '+eng,10,60);

let y=70;
Object.keys(data).forEach(cat=>{
 doc.setFont('helvetica','bold');doc.text(cat.toUpperCase()+' - '+data[cat].length+' Items:',10,y);y+=7;
 doc.setFont('helvetica','normal');
 data[cat].forEach((t,i)=>{
  let status=states[cat][i]?'OK':'NOT OK';
  doc.text((i+1)+'. '+t+' : '+status,12,y);
  y+=7;if(y>275){doc.addPage();y=15}
 });
 y+=4;if(y>275){doc.addPage();y=15}
});

doc.text('Notes: '+notes,10,y);y+=10;
doc.text('Inspector Signature:',10,y);
try{
 let empty=document.createElement('canvas');empty.width=canvas.width;empty.height=canvas.height;
 if(canvas.toDataURL()!==empty.toDataURL()){
  let img=canvas.toDataURL('image/png');
  doc.addImage(img,'PNG',10,y+5,60,20);
 }
}catch(e){}
doc.save('HSE_'+company+'_'+now.toISOString().slice(0,10)+'.pdf');
}
render();
</script>
</body>
</html>
