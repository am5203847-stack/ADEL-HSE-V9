 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSE SBG Rakaez V9.3 PDF</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body{background:#0f172a;color:white;font-family:system-ui;padding:15px}
.card{border:2px solid #eab308;border-radius:15px;padding:15px;background:#1e293b;margin-bottom:15px}
canvas{background:white;border-radius:10px;width:100%;height:180px;touch-action:none}
button{padding:14px;border-radius:10px;border:none;font-weight:bold;width:100%;margin-top:8px}
.btn-green{background:#16a34a;color:white}
.btn-blue{background:#2563eb;color:white}
.btn-yellow{border:2px solid #eab308;background:transparent;color:#eab308}
</style>
</head>
<body>
<h2 style="text-align:center">تقرير HSE SBG Rakaez V9.3</h2>
<div class="card">
<h3>✍️ توقيع المفتش - اسحب باصبعك</h3>
<canvas id="sigCanvas"></canvas>
<div style="display:flex;gap:8px">
<button class="btn-green" onclick="saveSig()">حفظ التوقيع</button>
<button class="btn-yellow" onclick="clearSig()">مسح</button>
</div>
<p id="sigStatus">لم يتم التوقيع</p>
</div>
<div class="card">
<button class="btn-green" onclick="generateWhatsAppReport()">📄 تقرير واتساب نظيف</button>
<button class="btn-blue" onclick="exportPDF()">📄 تصدير PDF بالتوقيع</button>
<button class="btn-yellow" onclick="if(confirm('تصفير؟')){localStorage.clear();location.reload()}">تصفير</button>
</div>
<script>
const canvas=document.getElementById('sigCanvas');const ctx=canvas.getContext('2d');let drawing=false,hasSig=false;
function resize(){canvas.width=canvas.offsetWidth*2;canvas.height=360;ctx.scale(2,2);ctx.lineWidth=5;ctx.lineCap='round';ctx.strokeStyle='#000'}resize();
function pos(e){const r=canvas.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return {x:t.clientX-r.left,y:t.clientY-r.top}}
canvas.addEventListener('mousedown',e=>{drawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)});
canvas.addEventListener('touchstart',e=>{e.preventDefault();drawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)},{passive:false});
canvas.addEventListener('mousemove',e=>{if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();hasSig=true});
canvas.addEventListener('touchmove',e=>{e.preventDefault();if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();hasSig=true},{passive:false});
window.addEventListener('mouseup',()=>drawing=false);window.addEventListener('touchend',()=>drawing=false);
function saveSig(){if(!hasSig){alert('وقع الاول');return}localStorage.setItem('hse_signature',canvas.toDataURL());document.getElementById('sigStatus').innerText='✅ تم حفظ التوقيع';alert('✅ تم حفظ التوقيع');}
function clearSig(){ctx.clearRect(0,0,canvas.width,canvas.height);hasSig=false;localStorage.removeItem('hse_signature');document.getElementById('sigStatus').innerText='لم يتم التوقيع';}
function generateWhatsAppReport(){let sig=localStorage.getItem('hse_signature')?'✅ تم التوقيع':'❌ بدون توقيع';alert('تقرير HSE - '+sig);}
function exportPDF(){const s=localStorage.getItem('hse_signature');if(!s){alert('⚠️ وقع الاول ودوس حفظ التوقيع');return}const {jsPDF}=window.jspdf;const doc=new jsPDF('p','mm','a4');doc.text('HSE SBG Rakaez V9.3 - Adel - '+new Date().toLocaleDateString(),10,15);doc.text('Location: Rakaez A-4/h - SBG',10,25);doc.addImage(s,'PNG',10,35,70,30);doc.save('HSE-Rakaez-'+Date.now()+'.pdf');}
</script>
</body>
</html>
