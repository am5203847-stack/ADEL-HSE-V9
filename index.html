<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSE SBG Rakaez V10.1 FIXED</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body{background:#0f1115;color:#fff;font-family:Arial;padding:15px;margin:0}
.card{border:1.5px solid #d4af37;border-radius:18px;padding:16px;background:#151821}
h2{text-align:center;color:#d4af37;margin:5px}
.item{padding:12px;margin:8px 0;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between;border:1px solid #333;background:#1e2230}
.item.ok{background:#0a3d1a;border-color:#16a34a}
.check{background:#ffcc00;color:#000;padding:4px 12px;border-radius:6px;font-weight:900;min-width:30px;text-align:center}
.btn{width:100%;padding:14px;border-radius:12px;border:0;margin-top:10px;font-size:17px;font-weight:700;cursor:pointer}
.green{background:#16a34a;color:#fff}
.outline{background:transparent;border:1px solid #d4af37;color:#d4af37}
input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #444;background:#222;color:#fff;margin:6px 0;box-sizing:border-box}
canvas{background:#fff;border-radius:12px;width:100%;height:180px;touch-action:none}
</style>
</head>
<body>
<div class="card">
<h2>HSE SBG Rakaez V10.1</h2>
<input id="inspector" value="Adel Mohamed">
<select id="loc"><option>Rakaez Project</option><option>Site Office</option><option>Store</option></select>
<div id="list"></div>
<input id="engName" placeholder="Engineer Name">
<textarea id="notes" placeholder="Notes / Observations"></textarea>
<p style="text-align:center;margin:10px 0 5px">Signature:</p>
<canvas id="sig"></canvas>
<button class="btn outline" onclick="clearSig()">Clear Signature</button>
<button class="btn green" onclick="genPDF()">Generate PDF V10.1 FIXED</button>
</div>
<script>
const items=["Safety Helmet","Safety Shoes","Vest","Harness","Scaffold Inspection","Ladder Safety","Electrical Safety","Fire Extinguisher","Housekeeping","Barrication","Tool Box Talk","Work Permit","First Aid Box","Emergency Exit","Signage","Waste Management","Earthing Pit","Lightning Arrester","Safety Net","Handover"];
let state=Array(20).fill(false);
let list=document.getElementById('list');
items.forEach((t,i)=>{
 let d=document.createElement('div');d.className='item';d.id='i'+i;
 d.innerHTML='<span>'+(i+1)+'. '+t+'</span><span class="check" id="c'+i+'">--</span>';
 d.onclick=()=>{state[i]=!state[i];update(i)};list.appendChild(d);
});
function update(i){
 let el=document.getElementById('i'+i);let ch=document.getElementById('c'+i);
 if(state[i]){el.classList.add('ok');ch.textContent='OK';}else{el.classList.remove('ok');ch.textContent='--';}
}
let canvas=document.getElementById('sig'),ctx=canvas.getContext('2d'),draw=false;
function resize(){let r=window.devicePixelRatio||1;canvas.width=canvas.offsetWidth*r;canvas.height=180*r;ctx.setTransform(r,0,0,r,0,0);ctx.lineWidth=2;ctx.lineCap='round';ctx.strokeStyle='#000';}
setTimeout(resize,200);
canvas.addEventListener('pointerdown',e=>{draw=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY);e.preventDefault()});
canvas.addEventListener('pointermove',e=>{if(!draw)return;ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke();e.preventDefault()});
window.addEventListener('pointerup',()=>draw=false);
function clearSig(){ctx.clearRect(0,0,canvas.width,canvas.height)}

function genPDF(){
 const {jsPDF}=window.jspdf;let doc=new jsPDF();
 let inspector=document.getElementById('inspector').value||'Adel Mohamed';
 let loc=document.getElementById('loc').value;
 let eng=document.getElementById('engName').value||'N/A';
 let notes=document.getElementById('notes').value||'N/A';
 let now=new Date();let dateStr=String(now.getDate()).padStart(2,'0')+'/'+String(now.getMonth()+1).padStart(2,'0')+'/'+now.getFullYear()+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
 doc.setFont('helvetica','bold');doc.setFontSize(14);
 doc.text('HSE Inspection Report - SBG Rakaez',10,15);
 doc.setFont('helvetica','normal');doc.setFontSize(11);
 doc.text('Inspector: '+inspector,10,25);
 doc.text('Location: '+loc,10,32);
 doc.text('Date: '+dateStr,10,39);
 doc.text('Engineer: '+eng,10,46);
 let y=55;
 items.forEach((t,i)=>{
   let status=state[i]?'OK':'NOT OK';
   doc.text((i+1)+'. '+t+' : '+status,10,y);
   y+=7;if(y>275){doc.addPage();y=15}
 });
 y+=5;doc.text('Notes: '+notes,10,y);
 y+=10;doc.text('Inspector Signature:',10,y);
 try{
  let empty=document.createElement('canvas');empty.width=canvas.width;empty.height=canvas.height;
  if(canvas.toDataURL()!==empty.toDataURL()){
    let img=canvas.toDataURL('image/png');
    doc.addImage(img,'PNG',10,y+5,60,20);
  }
 }catch(e){}
 doc.save('HSE_Adel_'+now.toISOString().slice(0,10)+'.pdf');
}
</script>
</body>
</html>
