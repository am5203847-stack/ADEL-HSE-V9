DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADEL V9.3</title><style>body{background:#000;color:#FFD700;font-family:Tahoma;padding:10px;padding-bottom:120px}.h{border:3px solid #00FF7F;border-radius:20px;padding:15px;text-align:center;background:#0a0a0a}input{flex:1;background:#1a1a1a;border:1.5px solid #FFD700;border-radius:10px;padding:10px;color:#FFD700;text-align:center}.row{display:flex;gap:6px;margin:6px 0}button{padding:12px;border-radius:12px;border:none;font-weight:bold}.g{background:#FFD700;color:#000;width:100%;margin-top:6px}.card{background:#1a1a1a;border:1px solid #FFD700;border-radius:10px;padding:10px;text-align:center}.card.a{background:#FFD700;color:#000}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:10px 0}.list{display:none;border:2px solid #FFD700;border-radius:15px;padding:10px;margin-top:10px}.list.a{display:block}.item{display:flex;gap:8px;background:#1a1a1a;padding:8px;border-radius:8px;margin-bottom:5px}.item.d{background:#003300}canvas{width:100%;height:180px;background:#fff;border-radius:10px;touch-action:none;border:2px solid #00FF7F}.foot{position:fixed;bottom:0;left:0;right:0;display:flex;gap:6px;padding:10px;background:#000}.b1{background:#00FF7F;color:#000;flex:1}.b2{background:#222;color:#FFD700;border:1px solid #FFD700;flex:1}</style></head><body><div class="h"><h2 style="color:#00FF7F">✅ ADEL V9.3 - توقيع ثابت</h2><p>SBG | Rakaez A-4/h</p><div class="row"><input id="c1" placeholder="الشركة"><input id="c2" placeholder="المشروع"></div><div class="row"><input id="c3" placeholder="اسم المفتش"><input id="c4" placeholder="المنطقة"></div><button class="g" onclick="localStorage.setItem('c1',c1.value);localStorage.setItem('c2',c2.value);localStorage.setItem('c3',c3.value);localStorage.setItem('c4',c4.value);alert('تم الحفظ')">💾 حفظ</button><p id="p" style="color:#00FF7F;margin-top:8px;font-weight:bold">0%</p></div><div class="grid"><div class="card a" onclick="sh('f',this)">🚜 فوركلفت 29</div><div class="card" onclick="sh('s',this)">🧱 سقالات 30</div><div class="card" onclick="sh('cr',this)">🏗️ كرين 25</div><div class="card" onclick="sh('e',this)">⚡ كهرباء 20</div><div class="card" onclick="sh('w',this)">🔥 PTW</div><div class="card" onclick="sh('pp',this)">🪖 PPE</div></div><div id="f" class="list a"></div><div id="s" class="list"></div><div id="cr" class="list"></div><div id="e" class="list"></div><div id="w" class="list"></div><div id="pp" class="list"></div><div style="border:2px solid #00FF7F;border-radius:15px;padding:10px;margin-top:10px;background:#0f0f0f"><h3 style="text-align:center;color:#00FF7F">✍️ توقيع المفتش - اسحب بإصبعك</h3><canvas id="sig"></canvas><div class="row" style="margin-top:6px"><button onclick="cl()" style="flex:1;background:#222;color:#FFD700;border:1px solid #FFD700">مسح</button><button onclick="sv()" style="flex:1;background:#00FF7F;color:#000">حفظ التوقيع</button></div><p id="ss" style="text-align:center;font-size:11px;color:#aaa">لم يتم التوقيع</p></div><div class="foot"><button class="b1" onclick="rep()">📄 تقرير واتساب نظيف</button><button class="b2" onclick="if(confirm('تصفير؟')){for(let k in D)D[k].forEach((_,i)=>localStorage.removeItem(k+i));location.reload()}">تصفير</button></div><script>D={f:["زيت المحرك","مياه الردياتير","زيت الهيدروليك","البطارية","الاطارات","الفرامل","الاضواء","البوري","حزام الامان","مرايا","شوكات الرفع","سلاسل الرفع","التوجيه","طفاية الحريق","شهادة الفحص","رخصة السائق","نظافة","تسريب زيوت","عمر الاطارات","البطارية شحن","لوحة التحكم","فرامل الطوارئ","انذار الرجوع","تآكل الشوكة","خراطيم الهيدروليك","الكرسي","قفل الشوكة","سجل الصيانة","التدريب"],e:["Main Panel","Breakers","Wiring","Sockets","Lighting","Earth","DB Dressing","Cable Trays","Isolation","LOTO","RCD Test","Labels","Clearance","Fire Ext","PPE Electrical","Permit","Insulated Tools","Cable Condition","Overload","Final Inspection"],s:Array.from({length:30},(_,i)=>`سقالات ${i+1}`),cr:Array.from({length:25},(_,i)=>`كرين ${i+1}`),w:["تصريح حار","تصريح بارد","ارتفاعات","حفر","مكان مغلق","كهرباء","اغلاق"],pp:["خوذة","سيفتي","نظارة","جوانتي","حزام امان","كمامة","واقي اذن","فيست"]};function render(){for(let k in D){let el=document.getElementById(k);el.innerHTML=`<h3>${k}</h3>`;D[k].forEach((t,i)=>{let id=k+i;let d=document.createElement('div');d.className='item';if(localStorage.getItem(id)=='1')d.classList.add('d');d.innerHTML=`<input type="checkbox" id="${id}" ${localStorage.getItem(id)=='1'?'checked':''} onchange="tg(this)"><label style="flex:1;color:#fff;font-size:13px">${t}</label>`;el.appendChild(d);});}up();}function tg(cb){localStorage.setItem(cb.id,cb.checked?'1':'0');cb.parentElement.classList.toggle('d',cb.checked);up();}function up(){let tot=0,don=0;for(let k in D){D[k].forEach((_,i)=>{tot++;if(localStorage.getItem(k+i)=='1')don++;});}document.getElementById('p').innerText=`تم ${don}/${tot} - ${Math.round(don/tot*100)||0}%`;}function sh(id,el){document.querySelectorAll('.list').forEach(x=>x.classList.remove('a'));document.querySelectorAll('.card').forEach(x=>x.classList.remove('a'));document.getElementById(id).classList.add('a');el.classList.add('a');}let cv=document.getElementById('sig'),ctx=cv.getContext('2d'),dr=false,last={x:0,y:0};function rs(){cv.width=cv.offsetWidth;cv.height=180;ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#000';let s=localStorage.getItem('sig');if(s){let im=new Image();im.onload=()=>{ctx.drawImage(im,0,0);document.getElementById('ss').innerText='✅ توقيع محفوظ'};im.src=s;}}rs();function pos(e){let r=cv.getBoundingClientRect();let x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;let y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;return {x,y};}cv.addEventListener('touchstart',e=>{e.preventDefault();dr=true;last=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);},{passive:false});cv.addEventListener('touchmove',e=>{e.preventDefault();if(!dr)return;let p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;},{passive:false});cv.addEventListener('touchend',e=>{e.preventDefault();dr=false;});cv.addEventListener('mousedown',e=>{dr=true;last=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);});cv.addEventListener('mousemove',e=>{if(!dr)return;let p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();});cv.addEventListener('mouseup',()=>dr=false);function cl(){ctx.clearRect(0,0,cv.width,cv.height);localStorage.removeItem('sig');document.getElementById('ss').innerText='❌ بدون توقيع';}function sv(){localStorage.setItem('sig',cv.toDataURL());document.getElementById('ss').innerText='✅ تم الحفظ';alert('تم حفظ التوقيع ✅');}function rep(){let don=0,tot=0;for(let k in D){D[k].forEach((_,i)=>{tot++;if(localStorage.getItem(k+i)=='1')don++;});}if(don==0){alert('علم على بنود الأول');return;}let c1=document.getElementById('c1').value||'SBG',c2=document.getElementById('c2').value||'Rakaez A-4/h',c3=document.getElementById('c3').value||'Adel',sig=localStorage.getItem('sig')?'✅ تم التوقيع':'❌ بدون توقيع';let t=`*تقرير HSE SBG Rakaez*%0A*V9.3 توقيع ثابت*%0A%0A📅 ${new Date().toLocaleDateString('ar-EG')}%0A🏢 ${c1}%0A📍 ${c2}%0A👷 ${c3}%0A✍️ ${sig}%0A📊 ${don}/${tot} (${Math.round(don/tot*100)}%)%0A%0A`;for(let k in D){let cc=0;D[k].forEach((_,i)=>{if(localStorage.getItem(k+i)=='1')cc++;});if(cc>0){t+=`*${k}: ${cc}/${D[k].length}*%0A`;D[k].forEach((txt,i)=>{if(localStorage.getItem(k+i)=='1')t+=`✅ ${txt}%0A`;});t+=`%0A`;}}t+=`*التوقيع محفوظ*`;window.open('https://wa.me/?text='+t,'_blank');}c1.value=localStorage.getItem('c1')||'';c2.value=localStorage.getItem('c2')||'';c3.value=localStorage.getItem('c3')||'';c4.value=localStorage.getItem('c4')||'';render();</script></body></html>
